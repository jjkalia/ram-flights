# Bouton "Update" : indexe n'importe quelle plage de dates depuis les
# archives ADSB.lol (gratuit) et enregistre dans le dépôt.
# NOUVEAU fichier à créer : .github/workflows/update.yml

name: Update RAM flights
on:
  workflow_dispatch:
    inputs:
      debut:
        description: "Première date (AAAA-MM-JJ)"
        required: true
        default: "2026-08-01"
      fin:
        description: "Dernière date (AAAA-MM-JJ)"
        required: true
        default: "2026-08-31"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }

      - name: Indexer les journées demandées (ADSB.lol)
        run: python3 build_ram_flights.py "${{ inputs.debut }}" "${{ inputs.fin }}"

      - name: Enregistrer dans le dépôt
        run: |
          git config user.name  "robot"
          git config user.email "robot@users.noreply.github.com"
          git add ram_flights.json
          git diff --cached --quiet && echo "Rien de nouveau" || \
            git commit -m "Vols ${{ inputs.debut }} -> ${{ inputs.fin }} (ADSB.lol)"
          git push
