# Version 2 : avec vérifications avant démarrage et messages d'erreur clairs.
# Remplace ENTIÈREMENT le contenu de .github/workflows/build.yml
# (ouvrir le fichier sur GitHub -> crayon -> tout sélectionner -> coller -> Commit changes)

name: Build RAM flights
on:
  workflow_dispatch: {}

jobs:
  month:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { s: "2025-08-01", e: "2025-08-31" }
          - { s: "2025-09-01", e: "2025-09-30" }
          - { s: "2025-10-01", e: "2025-10-31" }
          - { s: "2025-11-01", e: "2025-11-30" }
          - { s: "2025-12-01", e: "2025-12-31" }
          - { s: "2026-01-01", e: "2026-01-31" }
          - { s: "2026-02-01", e: "2026-02-28" }
          - { s: "2026-03-01", e: "2026-03-31" }
          - { s: "2026-04-01", e: "2026-04-30" }
          - { s: "2026-05-01", e: "2026-05-31" }
          - { s: "2026-06-01", e: "2026-06-30" }
          - { s: "2026-07-01", e: "2026-07-31" }
    steps:
      - uses: actions/checkout@v5

      - name: Vérifier que les fichiers sont bien là
        run: |
          echo "=== Fichiers présents à la racine du dépôt ==="
          ls -la
          if [ ! -f build_ram_flights.py ]; then
            echo "::error::FICHIER MANQUANT : build_ram_flights.py est absent ou mal nommé (vérifiez espaces / majuscules)"
            exit 1
          fi
          if [ ! -f fleet_RAM.json ]; then
            echo "::error::FICHIER MANQUANT : fleet_RAM.json est absent ou mal nommé (vérifiez espaces / majuscules, le _ et les MAJUSCULES RAM)"
            exit 1
          fi
          python3 -c "import json; d=json.load(open('fleet_RAM.json')); print('fleet_RAM.json OK :', len(d), 'avions')"

      - name: Fouiller le mois ${{ matrix.s }}
        run: python3 build_ram_flights.py "${{ matrix.s }}" "${{ matrix.e }}"

      - uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.s }}
          path: ram_flights.json

  merge:
    needs: month
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: parts }
      - name: Fusionner les 12 morceaux
        run: |
          python3 - << 'EOF'
          import json, glob
          total = {}
          for f in glob.glob('parts/*/ram_flights.json'):
              total.update(json.load(open(f)))
          json.dump(total, open('ram_flights.json','w'), sort_keys=True)
          print(len(total), "journées fusionnées")
          EOF
      - uses: actions/upload-artifact@v4
        with:
          name: ram_flights_COMPLET
          path: ram_flights.json
