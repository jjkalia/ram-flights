# Boucheur de trous OpenSky.
# NOUVEAU fichier à créer : .github/workflows/gaps.yml
# Prérequis : les secrets OPENSKY_CLIENT_ID et OPENSKY_CLIENT_SECRET
# (Settings -> Secrets and variables -> Actions -> New repository secret)

name: Boucher les trous (OpenSky)
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 1 }
      - name: Récupérer les journées manquantes via OpenSky
        env:
          OPENSKY_CLIENT_ID: ${{ secrets.OPENSKY_CLIENT_ID }}
          OPENSKY_CLIENT_SECRET: ${{ secrets.OPENSKY_CLIENT_SECRET }}
        run: python3 fill_gaps.py
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name  "robot"
          git config user.email "robot@users.noreply.github.com"
          git add ram_flights.json
          git diff --cached --quiet && echo "Rien de nouveau" || \
            git commit -m "Journées vides complétées via OpenSky"
          git push
